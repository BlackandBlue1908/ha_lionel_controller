set_speed:
  fields:
    device_id:
      required: false
      selector:
        device:
          integration: lionel_controller
    speed:
      required: true
      example: 50
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"

set_direction:
  fields:
    device_id:
      required: false
      selector:
        device:
          integration: lionel_controller
    direction:
      required: true
      example: "forward"
      selector:
        select:
          options:
            - "forward"
            - "reverse"

stop:
  fields:
    device_id:
      required: false
      selector:
        device:
          integration: lionel_controller

horn:
  fields:
    device_id:
      required: false
      selector:
        device:
          integration: lionel_controller

bell:
  fields:
    device_id:
      required: false
      selector:
        device:
          integration: lionel_controller

lights_on:
  fields:
    device_id:
      required: false
      selector:
        device:
          integration: lionel_controller

lights_off:
  fields:
    device_id:
      required: false
      selector:
        device:
          integration: lionel_controller

play_announcement:
  fields:
    device_id:
      required: false
      selector:
        device:
          integration: lionel_controller
    announcement:
      required: true
      example: 1
      selector:
        number:
          min: 0
          max: 6

connect:
  fields:
    device_id:
      required: false
      selector:
        device:
          integration: lionel_controller

disconnect:
  fields:
    device_id:
      required: false
      selector:
        device:
          integration: lionel_controller
